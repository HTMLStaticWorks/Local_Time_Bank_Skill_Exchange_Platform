<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Local Time Bank</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = { darkMode: ['class', '[data-theme="dark"]'], theme: { extend: { colors: { primary: 'var(--primary-color)', 'primary-dark': 'var(--primary-dark)', secondary: 'var(--secondary-color)', theme: { bg: 'var(--bg-main)', card: 'var(--bg-card)', text: 'var(--text-main)', muted: 'var(--text-muted)', border: 'var(--border-color)', } }, fontFamily: { sans: ['Inter', 'sans-serif'], } } } }
    </script>
</head>
<body class="bg-theme text-theme antialiased min-h-screen flex items-center justify-center p-4">
    
    <!-- Controls top right -->
    <div class="fixed top-4 right-4 flex items-center gap-2">
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-theme-card border border-theme-border transition-colors"><i id="theme-icon" data-lucide="moon" class="w-5 h-5 text-theme-text"></i></button>
        <button id="rtl-toggle" class="p-2 rounded-full hover:bg-theme-card border border-theme-border transition-colors"><i id="rtl-icon" data-lucide="arrow-right-left" class="w-5 h-5 text-theme-text"></i></button>
    </div>

    <!-- Auth Card -->
    <div class="w-full max-w-md bg-theme-card border border-theme-border rounded-3xl shadow-2xl p-8 sm:p-10">
        <!-- Logo -->
        <a href="index.html" class="flex flex-row items-center justify-center gap-3 mb-8">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white shadow-lg">
                <i data-lucide="clock" class="w-7 h-7"></i>
            </div>
            <span class="text-2xl font-bold tracking-tight">TimeBank</span>
        </a>

        <div class="text-center mb-8">
            <h1 class="text-xl font-bold mb-2">Welcome back</h1>
            <p class="text-theme-muted text-sm">Log in to your account to continue exchanging.</p>
        </div>

        <form class="space-y-5" onsubmit="event.preventDefault(); window.location.href='dashboard.html'">
            <div>
                <label class="block text-sm font-medium mb-1">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-theme-muted">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </div>
                    <input type="email" required class="block w-full pl-10 pr-3 py-3 bg-theme border border-theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-theme-muted">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </div>
                    <input type="password" required class="block w-full pl-10 pr-10 py-3 bg-theme border border-theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                    <button type="button" class="toggle-password absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i data-lucide="eye" class="w-5 h-5 text-theme-muted"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded border-theme-border text-primary focus:ring-primary">
                    <span class="text-sm font-medium">Remember me</span>
                </label>
                <a href="#" class="text-sm font-medium text-primary hover:underline">Forgot password?</a>
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3.5 rounded-xl shadow-md transition-all">Log In</button>
        </form>

        <div class="mt-8">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-theme-border"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-theme-card text-theme-muted font-medium">Or continue with</span>
                </div>
            </div>

            <div class="mt-6 grid grid-cols-3 gap-3">
                <button class="flex justify-center items-center py-2.5 border border-theme-border bg-theme-card rounded-xl hover:-translate-y-1 hover:shadow-md hover:border-gray-300 dark:hover:border-gray-600 transition-all duration-300 cursor-pointer">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </button>
                <button class="flex justify-center items-center py-2.5 border border-theme-border bg-theme-card rounded-xl hover:-translate-y-1 hover:shadow-md hover:border-[#1877F2]/50 transition-all duration-300 cursor-pointer">
                    <svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                </button>
                <button class="flex justify-center items-center py-2.5 border border-theme-border bg-theme-card rounded-xl hover:-translate-y-1 hover:shadow-md hover:border-gray-800 dark:hover:border-gray-200 transition-all duration-300 cursor-pointer">
                    <svg class="w-5 h-5 text-black dark:text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.457c-1.576 0-3.238-1.077-4.48-1.077-1.258 0-2.617 1.045-3.957 1.045-1.745 0-3.35-1.012-4.238-2.587-1.802-3.2-1.222-7.854.776-10.749C1.104 5.617 2.502 4.673 3.987 4.673c1.242 0 2.503.856 3.328.856.84 0 2.278-.973 3.738-.824 1.583.078 3.03.785 3.864 1.996-3.324 1.93-2.775 6.786.643 8.163-.82 2.053-2.022 4.269-3.56 4.593zM10.978 4.41c-.244-1.265.513-2.607 1.597-3.411.968-.782 2.455-1.196 3.55-1.127.24 1.341-.577 2.768-1.54 3.513-.889.734-2.312 1.253-3.607 1.025z"/></svg>
                </button>
            </div>
        </div>

        <p class="mt-8 text-center text-sm text-theme-muted">
            Don't have an account? <a href="signup.html" class="font-bold text-primary hover:underline">Sign up</a>
        </p>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@0.260.0"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/validation.js"></script>
</body>
</html>
